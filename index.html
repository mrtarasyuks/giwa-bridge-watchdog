<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIWA Bridge Watchdog — find stuck ETH withdrawals</title>
  <meta name="description" content="Paste an address and see every ETH bridge transfer between Ethereum Sepolia and GIWA Sepolia, with a clear status for withdrawals stuck mid-way." />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%237c5cff%22 stroke-width=%222%22><path d=%22M12 3 4 6.5v5.2c0 4.6 3.3 7.4 8 9.3 4.7-1.9 8-4.7 8-9.3V6.5L12 3Z%22/></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="brand-icon" data-icon="logo"></span>
        <div>
          <h1 data-i18n="app.title">GIWA Bridge Watchdog</h1>
          <p class="tagline" data-i18n="app.tagline">Finds ETH bridge withdrawals stuck between Ethereum Sepolia and GIWA Sepolia</p>
        </div>
      </div>
      <div class="controls">
        <div class="lang-switch" id="lang-switch" role="group" data-i18n-aria-label="controls.language"></div>
        <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle theme"></button>
      </div>
    </header>

    <section id="network-stats" class="panel stats-panel reveal" aria-live="polite">
      <div class="stats-head">
        <span class="stats-icon" data-icon="chart"></span>
        <h2 data-i18n="stats.heading">Network-wide withdrawal stats</h2>
      </div>
      <p class="stats-source" id="stats-source"></p>
      <div class="stats-grid" id="stats-grid">
        <p class="loading-line" data-i18n="stats.loading">Loading network-wide stats from OptimismPortal2…</p>
      </div>
      <div id="stats-extra"></div>
    </section>

    <section class="panel search-panel reveal">
      <form id="search-form" class="search">
        <input
          id="address-input"
          type="text"
          data-i18n-placeholder="search.placeholder"
          placeholder="0x… wallet address"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" id="search-button" class="btn-primary">
          <span class="btn-icon" data-icon="search"></span>
          <span data-i18n="search.button">Check address</span>
        </button>
      </form>

      <div id="progress" class="progress" hidden></div>
      <div id="status" class="status-msg" hidden></div>
      <div id="scan-deeper" class="scan-deeper" hidden></div>
    </section>

    <main id="results" class="results" hidden>
      <section class="panel reveal-item">
        <h2>
          <span data-i18n="sections.withdrawalsTitle">Withdrawals</span>
          <span class="muted" data-i18n="sections.withdrawalsSub">L2 → L1 · GIWA Sepolia → Ethereum Sepolia</span>
        </h2>
        <p class="section-note" data-i18n-html="sections.withdrawalsNote"></p>
        <div id="withdrawals-list" class="list"></div>
      </section>

      <section class="panel reveal-item">
        <h2>
          <span data-i18n="sections.depositsTitle">Deposits</span>
          <span class="muted" data-i18n="sections.depositsSub">L1 → L2 · Ethereum Sepolia → GIWA Sepolia</span>
        </h2>
        <p class="section-note" data-i18n="sections.depositsNote"></p>
        <div id="deposits-list" class="list"></div>
      </section>
    </main>

    <footer>
      <p id="footer-data"></p>
      <p class="disclaimer" data-i18n="footer.disclaimer"></p>
      <p id="footer-links"></p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
