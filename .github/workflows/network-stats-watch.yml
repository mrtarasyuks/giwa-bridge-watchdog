name: Network stats watch

# Re-runs the same eth_getLogs query the live banner uses once a day, appends the result
# to ci/network-stats-history.json, and fails loudly if pendingCount drops sharply since
# the previous run (see scripts/check-network-stats.mjs) — a cheap, visible proof that the
# numbers on the page come from a real, continuously-checked data source.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run network stats check
        id: check
        run: node scripts/check-network-stats.mjs

      - name: Commit history snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ci/network-stats-history.json
          git diff --cached --quiet || git commit -m "chore: record daily network stats snapshot"
          git push
